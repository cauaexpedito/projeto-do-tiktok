services:
  - type: web
    name: ritmo-tiktok-planner
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_REDIRECT_URI
        sync: false
      - key: TIKTOK_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: TIKTOK_SCOPES
        value: user.info.basic,video.publish
